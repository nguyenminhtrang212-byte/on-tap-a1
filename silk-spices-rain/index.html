.vw{font-family:var(--word);font-size:19px;font-weight:700;line-height:1.2}

.vex{font-family:var(--word);font-size:15px;margin:6px 0 0;color:var(--ink)}
.note{background:var(--card);border-left:4px solid var(--hl);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:15px;box-shadow:var(--shadow)}

.model{font-family:var(--word);font-size:18px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;max-width:92vw;z-index:30}
@media (max-width:520px){.opts,.dict{padding-left:0}.card{padding-left:30px}.card::before{left:16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

let ALLV=[],VO=null;
function vScore(v){let s=0;const n=v.name;
  if(/Natural|Neural|Online/i.test(n))s+=60;
  if(/Premium|Enhanced/i.test(n))s+=45;
  if(/Google UK English/i.test(n))s+=30;
  if(/Sonia|Libby|Maisie|Ryan|Thomas|Serena|Daniel|Kate|Arthur|Martha|Stephanie/i.test(n))s+=20;
  if(v.lang==="en-GB")s+=15;else if(/^en[-_](US|AU|IE|NZ|CA)/i.test(v.lang))s+=6;
  if(/compact|espeak|Zarvox|Bad News|Bells|Trinoids|Whisper|Albert|Bubbles|Cellos|Jester|Organ|Superstar|Boing|Wobble|Junior|Ralph|Kathy|Grandma|Grandpa|Rocko|Shelley|Sandy|Flo|Eddy|Reed/i.test(n))s-=80;
  return s}
function loadVoices(){
  try{ALLV=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a))}catch(e){ALLV=[]}
  const saved=store.get("srVoice","");
  VO=ALLV.find(v=>v.name===saved)||ALLV[0]||null;
  drawVoice();
}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(t,rate){
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=rate||.92;
    if(VO){u.voice=VO;u.lang=VO.lang}
    setTimeout(()=>speechSynthesis.speak(u),40);
  }catch(e){toast("Trình duyệt này không đọc được. Hãy mở bằng Chrome, Edge hoặc Safari.")}
}
function drawVoice(){
  const el=$("#voice");if(!el)return;
  if(!ALLV.length){el.innerHTML=`<summary>🔊 Giọng đọc</summary><p class="mut">Trình duyệt này chưa có giọng tiếng Anh. Hãy mở bằng Chrome, Edge hoặc Safari.</p>`;return}
  el.innerHTML=`<summary>🔊 Giọng đọc: ${esc(VO.name.replace(/Microsoft |Online |\(Natural\) - /g,"").split(/[ (-]/)[0])}</summary>
   <div class="vrow"><label>Chọn giọng<select id="vsel">${ALLV.map(v=>`<option value="${esc(v.name)}" ${v===VO?"selected":""}>${esc(v.name.replace(/Microsoft |Online |\(Natural\) - /g,"").slice(0,48))}</option>`).join("")}</select></label><button class="speak" id="vtest">Nghe thử</button></div>

  $("#vsel").onchange=e=>{VO=ALLV.find(v=>v.name===e.target.value);store.set("srVoice",VO.name)};

}

  const box=document.getElementById(id);if(!box)return;
  const W=560,H=280,L=44,R=12,T=24,B=34,max=35,ticks=[0,10,20,30];
  const pw=W-L-R,ph=H-T-B,bw=pw/WHEAT.length;
  const y=v=>T+ph-(v/max)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart: wheat production 20, 21.5, 23, 31 and 30 million tonnes in 2000, 2005, 2010, 2015 and 2020.">`;
  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--ui)">${t}</text>`});
  WHEAT.forEach(([yr,v],i)=>{
    const x=L+i*bw+bw*0.22,w=bw*0.56,top=y(v),h=y(0)-top,r=4;
    s+=`<path d="M${x},${y(0)} V${top+r} Q${x},${top} ${x+r},${top} H${x+w-r} Q${x+w},${top} ${x+w},${top+r} V${y(0)} Z" fill="var(--bar)" data-tip="${yr}: ${v} million tonnes" tabindex="0"/>`;
    s+=`<text x="${x+w/2}" y="${top-6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" font-family="var(--ui)">${v}</text>`;
    s+=`<text x="${x+w/2}" y="${H-B+18}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--ui)">${yr}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/></svg><div class="tt" hidden></div>`;
  box.innerHTML=s;
  const tt=box.querySelector(".tt");
  const show=(el,cx,cy)=>{const r=box.getBoundingClientRect();tt.textContent=el.dataset.tip;tt.style.left=(cx-r.left)+"px";tt.style.top=(cy-r.top)+"px";tt.hidden=false};
  box.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("pointermove",e=>show(el,e.clientX,e.clientY));
    el.addEventListener("pointerleave",()=>tt.hidden=true);
    el.addEventListener("focus",()=>{const b=el.getBoundingClientRect();show(el,b.left+b.width/2,b.top)});
    el.addEventListener("blur",()=>tt.hidden=true);
  });
}

/* ---------- grading ---------- */
function isRight(q){const a=ST.ans[q.id];return q.part===2?norm(a)===norm(q.ans):a===q.ans}
function qPlain(q,n){
  if(q.part===1&&q.gap)return `Đọc hiểu, chỗ trống ${q.gap}`;
  if(q.part===1)return q.q;
  if(q.part===2)return plain(q.s).replace(q.ans,"____");
  return q.q;
}
function grade(){
  try{speechSynthesis.cancel()}catch(e){}
  const rows=ALLQ.map((q,i)=>({q,n:i+1,a:(ST.ans[q.id]||"").trim(),ok:isRight(q)}));
  const score=rows.filter(r=>r.ok).length;
  const per=[1,2,3].map(p=>{const r=rows.filter(x=>x.q.part===p);return [r.filter(x=>x.ok).length,r.length]});
  const detail=rows.filter(r=>!r.ok).map(r=>`Câu ${r.n}: "${r.a||"(bỏ trống)"}" → đúng "${r.q.ans}"`);
  detail.unshift(`Đọc hiểu ${per[0][0]}/${per[0][1]}, Nghe chép ${per[1][0]}/${per[1][1]}, Vận dụng ${per[2][0]}/${per[2][1]}.`);
  ST.result={rows,score,n:rows.length,per,detail};
  ST.phase="done";ST.tab="test";render();window.scrollTo({top:0});
}
function renderResult(){
  const {rows,score,n,per}=ST.result,pct=score/n;
  const msg=pct>=.9?"Rất tốt! Em nắm chắc từ vựng bài này.":pct>=.6?"Khá ổn. Xem lại các câu sai bên dưới nhé.":"Cần ôn thêm. Mở tab Ôn từ vựng, nghe lại từng từ rồi làm lại bài.";
  const sec=(p,title)=>`<h3 class="rvh">${title}</h3>`+rows.filter(r=>r.q.part===p).map(r=>`<div class="rv ${r.ok?"good":"badr"}">
    <div class="rq"><span class="n">${r.n}</span><span class="s">${esc(qPlain(r.q))}</span></div>
    ${r.ok?`<div class="ra ok">✓ ${esc(r.a)}</div>`:`<div class="ra no">✗ <s>${esc(r.a||"(bỏ trống)")}</s></div><div class="ra ok">✓ ${esc(r.q.ans)}</div>`}
    ${!r.ok||r.q.part===2?`<div class="rex">${esc(r.q.ex)}${r.q.part===2?` <button class="speak" data-say="${esc(plain(r.q.s))}">🔊</button><br>${esc(r.q.vi)}`:""}</div>`:""}
  </div>`).join("");
  $("#main").innerHTML=`<div class="panel result"><div class="mut">${esc(ST.name)}</div><div class="score">${score}/${n}</div><p>${msg}</p>
    <div class="pscore"><div><b>${per[0][0]}/${per[0][1]}</b><span>Đọc hiểu</span></div><div><b>${per[1][0]}/${per[1][1]}</b><span>Nghe và chép</span></div><div><b>${per[2][0]}/${per[2][1]}</b><span>Vận dụng</span></div></div></div>
   <div class="panel send" style="margin-top:14px" id="send"></div>
   <div class="panel" style="margin-top:14px">
    <h3 class="rvh" style="margin-top:0">Nghe lại bài đọc</h3>
    <p class="mut">Nghe bài “The secret of silk” với đầy đủ đáp án, vừa nghe vừa nhìn chữ.</p>
    <div class="actions" style="margin-top:6px"><button class="btn" data-say="${esc(fullPassage())}">🔊 Nghe bài đọc</button><button class="btn" data-say="${esc(fullPassage())}" data-slow="1">🐢 Nghe chậm</button></div>
    <div class="passage" style="margin-top:10px">${PASSAGE.map(p=>"<p>"+esc(p).replace(/\{(\d)\}/g,(m,g)=>`<mark>${esc(P1[g-1].ans)}</mark>`)+"</p>").join("")}</div>
    ${sec(1,"Phần 1 · Đọc hiểu")}${sec(2,"Phần 2 · Nghe và chép")}${sec(3,"Phần 3 · Vận dụng")}
   </div>
   <div class="actions"><button class="btn" id="redo">Làm lại bài</button><button class="btn primary" id="toVocab">Ôn từ vựng</button></div>`;
  drawSend();
  $("#redo").onclick=()=>{ST.phase="intro";ST.result=null;render()};
  $("#toVocab").onclick=()=>{ST.tab="vocab";render();window.scrollTo({top:0})};
}
function fullPassage(){return PASSAGE.map(p=>p.replace(/\{(\d)\}/g,(m,g)=>P1[g-1].ans)).join(" ")}
function formLink(){
  const e=SUBMIT.entries,r=ST.result,p=new URLSearchParams();
  if(!SUBMIT.formUrl||!e.name)return "";
  p.set("usp","pp_url");
  const put=(k,v)=>p.set(k.startsWith("entry.")?k:"entry."+k,v);
  put(e.name,ST.name.trim());put(e.quiz,QUIZ_NAME);put(e.score,`${r.score}/${r.n}`);
  put(e.detail,r.detail.join("\n").slice(0,1500));
  return SUBMIT.formUrl.split("?")[0]+"?"+p.toString();
}
function drawSend(){
  const r=ST.result,need=!ST.name.trim(),fl=formLink();
  const text=`Họ tên: ${ST.name||"(chưa nhập)"}\nBài: ${QUIZ_NAME}\nĐiểm: ${r.score}/${r.n}\nNộp lúc: ${new Date().toLocaleString("vi-VN")}\n${r.detail.join("\n")}`;
  $("#send").innerHTML=`<h3>Gửi kết quả cho giáo viên</h3>
   ${need?`<p class="warn">Nhập họ tên trước khi gửi.</p>`:""}
   <label class="field" for="sn2">Họ tên<input id="sn2" value="${esc(ST.name)}"></label>
   <div class="actions">${fl?`<a class="btn primary ${need?"off":""}" href="${esc(fl)}" target="_blank" rel="noopener">Gửi qua Google Form</a>`:""}<button class="btn" id="copy">Sao chép kết quả</button></div>
   <p class="mut">Google Form sẽ mở với kết quả đã điền sẵn. Em chỉ cần bấm <b>Gửi</b> (Submit), không cần đăng nhập.</p>
   <textarea id="rtext" readonly rows="5">${esc(text)}</textarea>`;
  $("#sn2").onchange=e=>{ST.name=e.target.value.trim();store.set("srName",ST.name);drawSend()};
  $("#copy").onclick=async()=>{
    let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
    if(!ok){const t=$("#rtext");t.select();try{ok=document.execCommand("copy")}catch(e){}}
    $("#copy").textContent=ok?"Đã sao chép":"Hãy bôi đen và sao chép";
  };
  document.querySelectorAll("#send a.off").forEach(a=>a.onclick=e=>{e.preventDefault();$("#sn2").focus()});
}

   <p class="mut">Một số từ trong vở đã được sửa chính tả: anual → annual, reas → rear, ettle → settle, iodicle → iodide, contrecversial → controversial.</p></div>
   ${VOCAB.map(g=>`<section class="grp"><h2>${esc(g.g)}</h2><p class="mut">${esc(g.d)}</p><div class="vgrid">${g.w.map(([w,ipa,vi,emo])=>`<div class="vitem">
     <div class="vtop"><span class="vw">${esc(w)}</span><span class="emo" aria-hidden="true">${emo}</span></div>

     <div class="actions" style="margin-top:6px;gap:6px"><button class="speak" data-say="${esc(w)}">🔊</button><button class="speak" data-say="${esc(w)}" data-slow="1">🐢</button></div>
   </div>`).join("")}</div></section>`).join("")}`;
}
function renderWT1(){
  $("#main").innerHTML=`<div class="note"><p>Những từ hay dùng nhất khi mô tả biểu đồ trong <b>Writing Task 1</b>. Ví dụ đều dựa trên biểu đồ lúa mì bên dưới, để em thấy từ được dùng thế nào.</p></div>
   ${chartFigure("chartW")}
   <div class="panel" style="margin:14px 0 22px">
    <h2 class="sub" style="margin-top:0">Đoạn mẫu</h2>
    <p class="model">${esc(MODEL)}</p>
    <div class="actions" style="margin-top:6px"><button class="btn" data-say="${esc(MODEL)}">🔊 Nghe đoạn mẫu</button><button class="btn" data-say="${esc(MODEL)}" data-slow="1">🐢 Nghe chậm</button></div>
    <p class="mut" style="margin-bottom:0">Cấu trúc: câu giới thiệu (biểu đồ cho thấy gì) → <b>Overall</b> (xu hướng chính) → chi tiết theo thời gian kèm số liệu.</p>
   </div>
   ${WT1.map(g=>`<section class="grp"><h2>${esc(g.g)}</h2><div class="vgrid">${g.w.map(([w,ipa,vi,ex])=>`<div class="vitem">
     <div class="vw">${esc(w)}</div><span class="vipa">${esc(ipa)}</span><div class="vvi">${esc(vi)}</div>
     <p class="vex">${esc(ex)}</p>
     <div class="actions" style="margin-top:6px;gap:6px"><button class="speak" data-say="${esc(w.replace(" / ",", "))}">🔊 Từ</button><button class="speak" data-say="${esc(ex)}">🔊 Câu</button></div>
   </div>`).join("")}</div></section>`).join("")}`;
  drawChart("chartW");
}

render();
